name: Naosledge CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04 # Stable image; do not follow ubuntu-latest -> 26 migration
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (Node.js 24)
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (Node.js 24)
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Offline unit tests
        run: npm run test:unit
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      # Cheap synthetic 10-route HTTP smoke: no production credentials or Neon
      # calls. Prevents an accidental release from bypassing the SHA gate.
      - name: Closed production release smoke
        run: npm run test:release:closed:local
